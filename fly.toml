# fly.toml app configuration file generated for weather-activity-ranker on 2026-07-30T15:35:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'weather-activity-ranker'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  CACHE_TTL_AQI_MS = '1800000'
  CACHE_TTL_GEOCODING_MS = '86400000'
  CACHE_TTL_MARINE_MS = '1800000'
  CACHE_TTL_WEATHER_MS = '1800000'
  CORS_ORIGIN = 'https://weather-activity-ranker.fly.dev'
  LOG_LEVEL = 'info'
  NODE_ENV = 'production'
  OPEN_METEO_MODE = 'live'
  OPEN_METEO_TIMEOUT_MS = '3000'
  PORT = '8080'
  RATE_LIMIT_MAX = '60'
  RATE_LIMIT_WINDOW_MS = '60000'
  SUMMARIZER_DAILY_CAP = '100'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
